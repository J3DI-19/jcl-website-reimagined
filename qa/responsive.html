<!doctype html><html lang="en"><meta charset="utf-8"><title>JCL responsive QA</title><style>body{margin:0;background:#333;color:white;font:14px sans-serif}nav{padding:12px;position:sticky;top:0}button{padding:8px;margin-right:8px}iframe{height:850px;border:0;display:block;background:#0b0c12}output{margin-left:20px}</style><nav>Viewport: <button>1440</button><button>1024</button><button>768</button><button>390</button><button>375</button><output></output></nav><iframe title="Website at selected viewport" src="/" width="1440"></iframe><script>const frame=document.querySelector('iframe');function report(){const d=frame.contentDocument;document.querySelector('output').textContent='Width '+frame.width+' | document '+d.documentElement.clientWidth+' | scroll '+d.documentElement.scrollWidth+' | overflow '+(d.documentElement.scrollWidth>d.documentElement.clientWidth)}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.width=b.textContent;setTimeout(report,300)});frame.onload=report;</script></html>
